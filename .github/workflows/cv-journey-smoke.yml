name: "CV Golden Journey Smoke (manual)"

# Dispatch-only production journey smoke for the CV path (#1425 documents
# inventory, #1426 analysis-vs-search routing). Uses ONE disposable synthetic
# account per run and always removes it. No real user, no deployment, no
# migration, no schema change, no product runtime change.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type SMOKE-CV-JOURNEY to authorize this production smoke"
        required: true
      expected_sha:
        description: "Exact live /version.commit under test"
        required: true

permissions:
  contents: read

concurrency:
  group: cv-journey-smoke-production
  cancel-in-progress: false

jobs:
  smoke:
    name: "CV golden journey production smoke"
    runs-on: ubuntu-latest
    # Above the script's worst-case request budget (~16.5 min), so the runner
    # cannot cancel the job mid-journey and skip the cleanup in `finally`.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: pip install --quiet psycopg2-binary
      - name: Run CV golden journey smoke
        env:
          SMOKE_CONFIRM: ${{ inputs.confirm }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/cv_journey_smoke.py
