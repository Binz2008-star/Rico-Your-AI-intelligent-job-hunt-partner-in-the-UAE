name: "PR Governance (trusted)"

# Trusted policy: pull_request_target runs the base branch's copy of this file.
# The PR head is never checked out or executed, and no secret reaches this job.
on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-governance:
    name: pr-governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the trusted BASE branch policy
        uses: actions/checkout@v4
        with:
          # No ref on purpose. pull_request_target must keep the workspace on
          # the trusted base branch; the PR head is data only and is not needed.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Exercise policy self-test
        run: python scripts/check_pr_governance.py --self-test

      - name: Enforce ready-state governance record
        # Read author-controlled fields from GitHub's event JSON as data. Never
        # interpolate PR body/login/branch text into YAML env, with, or shell.
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          pr = event.get("pull_request") or {}
          body_path = Path(".pr-body.md")
          body_path.write_text(pr.get("body") or "", encoding="utf-8")

          command = [
              sys.executable,
              "scripts/check_pr_governance.py",
              "--body-file",
              str(body_path),
              "--draft",
              str(bool(pr.get("draft"))).lower(),
              "--head-sha",
              str((pr.get("head") or {}).get("sha") or ""),
              "--author",
              str((pr.get("user") or {}).get("login") or ""),
          ]
          raise SystemExit(subprocess.call(command))
          PY
