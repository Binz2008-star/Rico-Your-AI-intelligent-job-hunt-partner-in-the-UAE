name: Keep Warm

# Keeps the backend warm (cold-start avoidance). The canonical backend moved to
# Railway (https://api.ricohunt.com — see deploy-production.yml, 2026-07-30);
# the retired onrender.com host is no longer served. This heater pings the
# canonical Railway /health every 10 minutes.
#
# - Read-only, no secrets, no repo checkout, no state.
# - This is a HEATER, not a monitor: a non-200 emits a warning, never a red
#   run — deploy gates and smoke workflows own alerting.
# - Kill switch: disable this workflow from the Actions UI.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend /health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
              "https://api.ricohunt.com/health" || true)
            if [ "$code" = "200" ]; then
              echo "healthy (200)"
              exit 0
            fi
            echo "attempt $i: HTTP ${code:-error} — retrying in 10s"
            sleep 10
          done
          echo "::warning::backend /health not 200 after 3 attempts (wake-up may be in progress)"
