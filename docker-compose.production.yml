# docker-compose.production.yml
# Warm-standby Docker stack for Rico AI.
#
# Operating model: CLOUD-PRIMARY + DOCKER WARM STANDBY
#   Active path:   GitHub → Vercel frontend, Render backend, Neon database
#   Standby path:  VPS → Caddy → Next.js + FastAPI + Redis
#
# This stack is for health validation and emergency readiness ONLY.
# It must NOT receive normal production user traffic.
# It must NOT connect to production Neon during routine validation.
# It must NOT send emails, process scheduled jobs, auto-apply, or run RQ workers.
#
# All side-effecting features are disabled by default via environment variables
# below. The RQ worker service is included but gated behind a Docker Compose
# profile — it does NOT start unless explicitly requested with --profile worker.
#
# NO PostgreSQL service — DATABASE_URL must point to a staging/test database
# during routine validation. Connecting to production Neon requires explicit
# operator action and is documented in docs/local-docker-production.md.
#
# Usage (local/staging validation):
#   docker compose -f docker-compose.production.yml --env-file .env.production up --build
#
# Usage (start RQ worker — zero-hour activation only):
#   docker compose -f docker-compose.production.yml --profile worker --env-file .env.production up --build
#
# Resource limits target a 4 GB VPS:
#   backend 768 MB + web 768 MB + redis 256 MB + caddy 128 MB = 1920 MB
#   With optional worker (512 MB): 2432 MB → ~1.5 GB remaining for OS headroom

services:
  backend:
    image: rico-backend:standby
    build:
      context: .
      dockerfile: Dockerfile.backend.production
    container_name: rico-backend-standby
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # ── Infrastructure ───────────────────────────────────────────
      - REDIS_URL=redis://redis:6379/0
      - RICO_ENV=production
      - APP_ENV=production
      - RENDER=false
      # ── Warm-standby safeguards (disable all side effects) ───────
      # These override any value in .env.production to ensure the
      # standby stack cannot trigger outbound actions during routine
      # validation. They are intentionally hardcoded here so a
      # misconfigured .env.production file cannot re-enable them.
      - RICO_ENABLE_AUTO_APPLY=false
      - RICO_REQUIRE_APPROVAL_FOR_APPLICATIONS=true
      - RICO_ENABLE_SCHEDULED_SEARCHES=false
      - ENABLE_SIGNUP_EMAIL_NOTIFICATIONS=false
      - RICO_ENABLE_LEARNING=false
      # ── Side-effect isolation — mechanically enforced ────────────
      # Explicitly clear all outbound integration credentials so a
      # misconfigured .env.production cannot supply them. These overrides
      # take precedence over env_file values.
      - TELEGRAM_BOT_TOKEN=
      - TELEGRAM_CHAT_ID=
      - TELEGRAM_ADMIN_BOT_TOKEN=
      - EMAIL_USER=
      - EMAIL_PASS=
      - SMTP_USER=
      - SMTP_PASSWORD=
      - PADDLE_API_KEY=
      - PADDLE_WEBHOOK_SECRET=
      - BILLING_MODE=manual
      - JOTFORM_API_KEY=
      - JOTFORM_FORM_ID=
      - JOTFORM_RICO_FORM_ID=
      - JOTFORM_WEBHOOK_SECRET=
      - RICO_ENABLE_EMAIL_ALERTS=false
      - RICO_ENABLE_USER_TELEGRAM_ALERTS=false
      - RICO_TELEGRAM_PUBLIC_ALERTS=false
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    mem_limit: 768m
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
        reservations:
          memory: 256M
    networks:
      - rico-standby

  web:
    image: rico-web:standby
    build:
      context: ./apps/web
      dockerfile: Dockerfile.production
      args:
        - BACKEND_API_BASE_URL=http://backend:8000
    container_name: rico-web-standby
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - BACKEND_API_BASE_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    mem_limit: 768m
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
        reservations:
          memory: 256M
    networks:
      - rico-standby

  redis:
    image: redis:7-alpine
    container_name: rico-redis-standby
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - rico-standby

  # RQ worker — DISABLED BY DEFAULT.
  # This service only starts when the operator explicitly passes
  # --profile worker to docker compose. During routine warm-standby
  # validation, the worker must NOT run. It is only needed during a
  # controlled zero-hour activation (see docs/local-docker-production.md).
  worker:
    image: rico-backend:standby
    build:
      context: .
      dockerfile: Dockerfile.backend.production
    container_name: rico-worker-standby
    restart: unless-stopped
    profiles: ["worker"]
    env_file:
      - .env.production
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RICO_ENV=production
      - APP_ENV=production
      - RENDER=false
      - RICO_ENABLE_AUTO_APPLY=false
      - RICO_REQUIRE_APPROVAL_FOR_APPLICATIONS=true
      - RICO_ENABLE_SCHEDULED_SEARCHES=false
      - ENABLE_SIGNUP_EMAIL_NOTIFICATIONS=false
      - RICO_ENABLE_LEARNING=false
      # ── Side-effect isolation — mechanically enforced ────────────
      - TELEGRAM_BOT_TOKEN=
      - TELEGRAM_CHAT_ID=
      - TELEGRAM_ADMIN_BOT_TOKEN=
      - EMAIL_USER=
      - EMAIL_PASS=
      - SMTP_USER=
      - SMTP_PASSWORD=
      - PADDLE_API_KEY=
      - PADDLE_WEBHOOK_SECRET=
      - BILLING_MODE=manual
      - JOTFORM_API_KEY=
      - JOTFORM_FORM_ID=
      - JOTFORM_RICO_FORM_ID=
      - JOTFORM_WEBHOOK_SECRET=
      - RICO_ENABLE_EMAIL_ALERTS=false
      - RICO_ENABLE_USER_TELEGRAM_ALERTS=false
      - RICO_TELEGRAM_PUBLIC_ALERTS=false
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-m", "src.rico_worker"]
    mem_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
    networks:
      - rico-standby

  caddy:
    image: caddy:2-alpine
    container_name: rico-caddy-standby
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      backend:
        condition: service_healthy
    mem_limit: 128m
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    networks:
      - rico-standby

volumes:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  rico-standby:
    driver: bridge
